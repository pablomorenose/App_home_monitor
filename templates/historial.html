<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HomeM — Historial</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/css/historial.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">HomeM</div>
      <h1>Historial</h1>
    </div>
    <a href="/" class="icon-btn" title="Volver" aria-label="Volver al panel">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" data-action="set-filter" data-filter="all">Todos</button>
    <button class="filter-btn" data-action="set-filter" data-filter="down">Caídas</button>
    <button class="filter-btn" data-action="set-filter" data-filter="up">Recuperaciones</button>
  </div>

  <div class="incident-list" id="incident-list">
    <div class="empty">Cargando…</div>
  </div>
</div>

<script src="/static/js/historial.js" defer></script>
</body>
</html>
