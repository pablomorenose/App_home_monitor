<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HomeM</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HomeM">
<link rel="apple-touch-icon" href="/static/icon-192.png">

<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Casa</div>
      <h1>Monitor</h1>
    </div>
    <div class="header-actions">
      <span class="clock" id="clock">--:--:--</span>
      <button class="icon-btn" id="theme-btn" data-action="toggle-theme" title="Tema" aria-label="Tema">
        <svg id="theme-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="/historial" class="icon-btn" title="Historial" aria-label="Historial">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
      </a>
      <button class="icon-btn" id="check-btn" data-action="force-check" title="Comprobar ahora" aria-label="Comprobar">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="icon-btn add" data-action="open-modal" title="Añadir" aria-label="Añadir dispositivo">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="notif-btn" data-action="toggle-notifications" title="Notificaciones" aria-label="Notificaciones">
        <svg id="notif-icon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </header>
  <div class="summary-bar" id="summary-bar"><div class="chip"><span class="dot"></span>Cargando…</div></div>
  <div class="summary-bar" id="filter-bar" style="margin-bottom:12px;">
    <button class="chip" data-filter="all" data-action="set-filter" id="filter-all" style="cursor:pointer;border:1px solid var(--accent);color:var(--accent);">Todos</button>
    <button class="chip" data-filter="online" data-action="set-filter" id="filter-online" style="cursor:pointer;">Online</button>
    <button class="chip" data-filter="offline" data-action="set-filter" id="filter-offline" style="cursor:pointer;">Offline</button>
  </div>
  <!-- Device list (all monitors rendered dynamically by renderDevices()) -->
  <div class="device-list" id="device-list"></div>

  <footer id="footer-note">Comprobando conexión…</footer>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modal-title">Añadir dispositivo</h2>
    <div class="fg"><label>Nombre</label><input type="text" id="f-name" placeholder="Ej: Router Casa"></div>
    <div class="fg"><label>ID único</label><input type="text" id="f-id" placeholder="router_casa"></div>
    <div class="fg">
      <label>Tipo</label>
      <select id="f-type">
        <option value="http">HTTP — URL accesible</option>
        <option value="ping">Ping — IP en red local</option>
        <option value="port">Puerto TCP</option>
        <option value="ha_entity">Entidad Home Assistant</option>
        <option value="ha_switch">Switch Home Assistant (toggle)</option>
        <option value="dns">DNS — Resolución de dominio</option>
        <option value="tls">TLS — Certificado SSL</option>
        <option value="docker">Docker — Contenedor</option>
        <option value="heartbeat">Heartbeat — Señal periódica</option>
        <option value="system">System — Host metrics</option>
      </select>
    </div>
    <div id="fields-http"><div class="fg"><label>URL</label><input type="text" id="f-url" placeholder="https://..."></div></div>
    <div id="fields-ping" style="display:none"><div class="fg"><label>Host / IP</label><input type="text" id="f-host-ping" placeholder="192.168.1.1"></div></div>
    <div id="fields-port" style="display:none">
      <div class="fg"><label>Host / IP</label><input type="text" id="f-host-port" placeholder="192.168.1.1"></div>
      <div class="fg"><label>Puerto</label><input type="number" id="f-port" placeholder="22"></div>
    </div>
    <div id="fields-ha" style="display:none"><div class="fg"><label>Entity ID de Home Assistant</label><input type="text" id="f-entity" placeholder="camera.sonoff1"></div></div>
    <div id="fields-dns" style="display:none">
      <div class="fg"><label>Host a resolver</label><input type="text" id="f-dns-host" placeholder="example.com"></div>
      <div class="fg"><label>Valor esperado (IP)</label><input type="text" id="f-dns-expected" placeholder="93.184.216.34 (opcional)"></div>
    </div>
    <div id="fields-tls" style="display:none">
      <div class="fg"><label>Host</label><input type="text" id="f-tls-host" placeholder="example.com"></div>
      <div class="fg"><label>Días aviso expiración</label><input type="number" id="f-tls-warn-days" value="14" min="1" max="90"></div>
    </div>
    <div id="fields-docker" style="display:none">
      <div class="fg"><label>Nombre del contenedor</label><input type="text" id="f-docker-container" placeholder="nginx"></div>
    </div>
    <div id="fields-heartbeat" style="display:none">
      <div class="fg"><label>Intervalo esperado (segundos)</label><input type="number" id="f-heartbeat-interval" value="60" min="10"></div>
    </div>
    <div id="fields-http-advanced" style="display:none">
      <div class="fg"><label>Método HTTP</label>
        <select id="f-http-method">
          <option value="GET">GET</option>
          <option value="HEAD">HEAD</option>
          <option value="POST">POST</option>
        </select>
      </div>
      <div class="fg"><label>Códigos de estado esperados</label><input type="text" id="f-expected-status" placeholder="200,301 (por defecto: 200)"></div>
      <div class="fg"><label>Palabra clave a verificar</label><input type="text" id="f-verify-keyword" placeholder="(opcional)"></div>
      <div class="fg"><label>Seguir redirecciones</label>
        <select id="f-follow-redirects">
          <option value="true">Sí</option>
          <option value="false">No</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>Intervalo de comprobación (seg)</label><input type="number" id="f-check-interval" value="60" min="10" max="3600"></div>
    <div class="fg"><label>Timeout (segundos)</label><input type="number" id="f-timeout" value="8" min="1" max="30"></div>
    <div class="fg"><label>Reintentos máximos</label><input type="number" id="f-max-retries" value="3" min="1" max="10"></div>
    <div class="modal-actions">
      <button class="btn-cancel2" data-action="close-modal">Cancelar</button>
      <button class="btn-save" data-action="save-device">Guardar</button>
    </div>
  </div>
</div>


<script src="/static/js/dashboard.js" defer></script>
</body>
</html>
