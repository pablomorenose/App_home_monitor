name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    - name: Check for undefined and unused names
      run: pyflakes *.py routes/*.py tests/*.py
    - name: Run tests
      run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag home-monitor:${{ github.sha }}
